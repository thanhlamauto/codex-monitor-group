name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r server/requirements.txt
      - run: PYTHONPATH=server python -m pytest -q server/tests

  agent-tests:
    name: Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/codex-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/codex-guard/go.mod
          cache-dependency-path: agent/codex-guard/go.sum
      - run: go test ./...
      - run: go vet ./...

  installer-checks:
    name: Installer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/test_installer.sh
