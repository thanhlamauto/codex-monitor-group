services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codex_monitor
      POSTGRES_USER: codex_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_monitor -d codex_monitor"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://codex_monitor:${POSTGRES_PASSWORD}@db:5432/codex_monitor
      CRON_SECRET: ${CRON_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CLASSROOM_TIMEZONE: ${CLASSROOM_TIMEZONE:-UTC}
      ONLINE_SECONDS: ${ONLINE_SECONDS:-180}
      LATE_SECONDS: ${LATE_SECONDS:-600}
      USAGE_MISMATCH_PERCENT: ${USAGE_MISMATCH_PERCENT:-10}
      USAGE_MISMATCH_MIN_TOKENS: ${USAGE_MISMATCH_MIN_TOKENS:-1000}
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
